<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상담 바구니 | 코웨이 렌탈 맞춤 상담</title>
<meta name="description" content="담아 둔 제품을 확인하고 한 번에 무료 상담을 신청하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="logo" href="index.html"><b>코웨이</b> 렌탈 맞춤 상담</a>
    <nav class="nav-items" aria-label="주 메뉴">
      <a href="products.html">제품</a>
      <a href="recommend.html">맞춤 추천</a>
      <a href="index.html#benefit">혜택</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="consult-done" id="consult-done" tabindex="-1" hidden>
    <h1>상담 신청이 접수됐어요</h1>
    <p>확인 후 연락드릴게요.</p>
    <div class="result-actions">
      <a class="btn btn-line num" href="tel:010-3490-8733">010-3490-8733</a>
      <a class="btn btn-line" href="index.html">처음으로</a>
    </div>
  </div>

  <div id="consult-body">
    <div class="page-head"><h1>상담 바구니</h1></div>

    <div class="consult-cols">
      <section aria-labelledby="basket-title">
        <h2 class="step-title" id="basket-title">담은 제품</h2>
        <ul class="b-list" id="basket-list" hidden></ul>
        <p class="b-sum" id="basket-sum" hidden></p>
        <p class="b-empty" id="basket-empty">담은 제품이 없어요. 연락처만 남겨도 돼요.</p>
        <div class="b-more">
          <a class="btn btn-line btn-small" href="products.html">제품 더 담기</a>
          <a class="btn btn-line btn-small" href="recommend.html">맞춤 추천</a>
        </div>
      </section>

      <section aria-labelledby="form-title">
        <h2 class="step-title" id="form-title">연락받을 곳</h2>
        <form class="form" id="consult-form" novalidate>
          <div class="field">
            <label for="f-name">이름</label>
            <input type="text" id="f-name" name="name" maxlength="50" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="f-contact">연락처</label>
            <input type="tel" id="f-contact" name="contact" maxlength="100" autocomplete="tel" inputmode="tel" placeholder="010-0000-0000" required>
          </div>
          <fieldset class="field">
            <legend>사용 장소</legend>
            <div class="seg">
              <label><input type="radio" name="kind" value="가정" checked><span>가정</span></label>
              <label><input type="radio" name="kind" value="사업장"><span>사업장</span></label>
              <label><input type="radio" name="kind" value="법인"><span>법인</span></label>
            </div>
          </fieldset>
          <div class="field">
            <label for="f-message">문의 내용 <span class="opt">(선택)</span></label>
            <textarea id="f-message" name="message" maxlength="1000"></textarea>
          </div>
          <div class="hp" aria-hidden="true"><label>비워 두세요 <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
          <label class="consent">
            <input type="checkbox" name="consent" required>
            <span>상담 연락을 위한 개인정보 수집·이용에 동의해요. (필수) <a href="privacy.html">처리방침</a></span>
          </label>
          <button type="submit" class="btn btn-main">상담 신청하기</button>
          <p class="form-msg" id="form-msg" role="alert" hidden></p>
        </form>
      </section>
    </div>
  </div>
</main>

<nav class="tabbar" aria-label="빠른 메뉴">
  <a href="products.html">제품</a>
  <a href="recommend.html">추천</a>
  <a href="tel:010-3490-8733">전화</a>
  <a class="on" href="consult.html">바구니 <span class="count-dot" data-basket-count hidden></span></a>
</nav>

<script src="assets/common.js"></script>
<script src="assets/consult.js"></script>
</body>
</html>
