<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>문의함</title>
<style>
:root{--paper:#FBFAF6;--mist:#E9F2EF;--butter:#FFF1CC;--ink:#14323A;--soft:#4C6268;--faint:#8A9A9D;--line:#DCE5E2;--honey:#F2B33D;--white:#fff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.6;word-break:keep-all}
h1,h2,p,ul{margin:0;padding:0}
ul{list-style:none}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
.btn{min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid var(--ink);background:var(--white);color:var(--ink);font-weight:700;cursor:pointer}
.btn-main{background:var(--honey);border-color:var(--honey)}
.login{max-width:360px;margin:15vh auto 0}
.login h1{font-size:24px;margin-bottom:16px}
.login input{width:100%;min-height:52px;padding:0 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--white);margin-bottom:10px;font-size:16px}
.login .btn{width:100%}
.err{color:#7A1E0E;background:#FDE7E2;border-radius:10px;padding:10px 14px;margin-top:10px;font-size:15px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.top h1{font-size:20px}
.count{background:var(--butter);border-radius:18px;padding:20px 22px;margin-bottom:14px}
.count b{display:block;font-size:44px;line-height:1.1}
.sources{background:var(--white);border:1px solid var(--line);border-radius:18px;margin-bottom:14px}
.sources summary{cursor:pointer;padding:14px 18px;font-weight:700}
.sources li{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;border-top:1px solid var(--line);font-size:15px}
.sources li span{overflow-wrap:anywhere}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.filters button{white-space:nowrap;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--white);color:var(--soft);font-weight:700;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--white)}
.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:10px}
.card.new{border-color:var(--honey);border-width:2px}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--faint)}
.name{font-size:19px;font-weight:700;margin-top:2px}
.contact{display:inline-block;margin-top:6px;min-height:44px;padding:0 14px;border-radius:10px;border:1.5px dashed var(--line);background:var(--paper);font-weight:700;font-size:17px;cursor:pointer;color:var(--ink)}
.block{margin-top:12px;font-size:15px}
.block span{display:block;font-size:13px;color:var(--faint)}
.block p{white-space:pre-wrap}
.states{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px}
.states button{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--soft);font-weight:700;cursor:pointer}
.states button[aria-pressed=true]{background:var(--mist);border-color:var(--ink);color:var(--ink)}
.empty{text-align:center;color:var(--soft);padding:40px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:10px 18px;border-radius:999px;font-size:14px}
</style>
</head>
<body>

<div class="wrap">
  <form class="login" id="login">
    <h1>문의함</h1>
    <label for="pw" style="display:block;font-weight:700;font-size:14px;margin-bottom:6px">관리자 비밀번호</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <button class="btn btn-main" type="submit">들어가기</button>
    <p class="err" id="login-err" role="alert" hidden></p>
  </form>

  <div id="app" hidden>
    <div class="top">
      <h1>문의함</h1>
      <button class="btn" type="button" id="logout">나가기</button>
    </div>
    <div class="count">새 문의<b id="new-count">0</b></div>
    <details class="sources" id="sources" hidden>
      <summary>유입 경로별 문의 수</summary>
      <ul id="source-list"></ul>
    </details>
    <div class="filters" id="filters">
      <button type="button" data-f="전체" aria-pressed="true">전체</button>
      <button type="button" data-f="새 문의" aria-pressed="false">새 문의</button>
      <button type="button" data-f="연락함" aria-pressed="false">연락함</button>
      <button type="button" data-f="완료" aria-pressed="false">완료</button>
    </div>
    <ul id="list"></ul>
    <p class="err" id="app-err" role="alert" hidden></p>
  </div>
</div>
<p class="toast" id="toast" role="status" hidden></p>

<script>
(() => {
  const KEY = 'admin-pass'; // 탭을 닫으면 사라지는 sessionStorage 에만 둔다
  const STATES = ['새 문의', '연락함', '완료'];
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let rows = [];
  let filter = '전체';

  const pass = () => sessionStorage.getItem(KEY) || '';
  const api = (method, body) => fetch('/api/admin', {
    method,
    headers: { 'x-admin-password': pass(), ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });

  function toast(text) {
    const t = $('#toast'); t.textContent = text; t.hidden = false;
    clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 1800);
  }
  const when = iso => new Date(iso).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  // 유입 경로: UTM 값이 있으면 그대로, 없으면 들어온 사이트, 그것도 없으면 "직접 방문"
  const sourceOf = r => r.utm_source || r.referrer || '직접 방문';
  const sourceText = r => r.utm_source
    ? [r.utm_source, r.utm_medium, r.utm_campaign, r.utm_content, r.utm_term].filter(Boolean).join(' / ')
    : (r.referrer ? r.referrer + ' 에서 들어옴' : '직접 방문 (UTM 없음)');

  function render() {
    $('#new-count').textContent = rows.filter(r => r.status === '새 문의').length;
    const bySource = {};
    rows.forEach(r => { const s = sourceOf(r); bySource[s] = (bySource[s] || 0) + 1; });
    const ranked = Object.entries(bySource).sort((a, b) => b[1] - a[1]);
    $('#sources').hidden = !rows.length;
    $('#source-list').innerHTML = ranked.map(([s, n]) => `<li><span>${esc(s)}</span><b>${n}건</b></li>`).join('');
    document.querySelectorAll('#filters button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === filter));
    const shown = rows.filter(r => filter === '전체' || r.status === filter);
    $('#list').innerHTML = shown.length ? shown.map(r => `<li class="card ${r.status === '새 문의' ? 'new' : ''}">
      <div class="meta"><span>${esc(when(r.created_at))}</span><span>${esc(r.kind || '')}</span></div>
      <p class="name">${esc(r.name)}</p>
      <button type="button" class="contact" data-copy="${esc(r.contact)}">${esc(r.contact)}</button>
      ${r.products ? `<div class="block"><span>상담받을 제품</span><p>${esc(r.products)}</p></div>` : ''}
      ${r.message ? `<div class="block"><span>문의 내용</span><p>${esc(r.message)}</p></div>` : ''}
      <div class="block"><span>유입 경로</span><p>${esc(sourceText(r))}</p></div>
      <div class="states">${STATES.map(s => `<button type="button" data-id="${r.id}" data-status="${s}" aria-pressed="${r.status === s}">${s}</button>`).join('')}</div>
    </li>`).join('') : `<li class="empty">${filter === '전체' ? '아직 들어온 문의가 없어요.' : '이 상태의 문의가 없어요.'}</li>`;
  }

  async function load() {
    const res = await api('GET');
    const body = await res.json().catch(() => ({}));
    if (res.status === 401) { sessionStorage.removeItem(KEY); showLogin(body.error || '비밀번호가 맞지 않아요.'); return false; }
    if (!res.ok) { showApp(); $('#app-err').textContent = body.error || '불러오지 못했어요.'; $('#app-err').hidden = false; return true; }
    rows = body.rows || [];
    $('#app-err').hidden = true;
    showApp(); render();
    return true;
  }
  function showLogin(error) {
    $('#app').hidden = true; $('#login').hidden = false;
    $('#pw').value = ''; $('#pw').focus();
    $('#login-err').textContent = error || ''; $('#login-err').hidden = !error;
  }
  function showApp() { $('#login').hidden = true; $('#app').hidden = false; }

  $('#login').addEventListener('submit', async e => {
    e.preventDefault();
    sessionStorage.setItem(KEY, $('#pw').value);
    await load();
  });
  $('#logout').addEventListener('click', () => { sessionStorage.removeItem(KEY); rows = []; showLogin(); });
  $('#filters').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { filter = b.dataset.f; render(); } });
  $('#list').addEventListener('click', async e => {
    const copy = e.target.closest('[data-copy]');
    if (copy) {
      try { await navigator.clipboard.writeText(copy.dataset.copy); toast('연락처를 복사했어요'); }
      catch { const range = document.createRange(); range.selectNodeContents(copy); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); }
      return;
    }
    const st = e.target.closest('[data-status]');
    if (!st || st.getAttribute('aria-pressed') === 'true') return;
    const res = await api('PATCH', { id: Number(st.dataset.id), status: st.dataset.status });
    if (!res.ok) { const body = await res.json().catch(() => ({})); toast(body.error || '바꾸지 못했어요.'); return; }
    toast('"' + st.dataset.status + '"(으)로 바꿨어요');
    await load();
  });

  if (pass()) load(); else showLogin();
})();
</script>
</body>
</html>
